name: Stage verified release assets
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful native build run ID
        required: true
        type: string
      platform:
        description: Package platform
        required: true
        type: choice
        options:
          - macos
          - windows
permissions:
  contents: write
  actions: read
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate the original build and its native test steps
        id: build
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          import json, os, re, subprocess
          run_id = os.environ['RUN_ID']
          platform = os.environ['PLATFORM']
          if not re.fullmatch(r'[0-9]{1,20}', run_id) or platform not in ('macos', 'windows'):
              raise ValueError('Invalid build selection')
          repository = 'feifeigong/ai-first-tools'
          def api(path):
              return json.loads(subprocess.run(['gh', 'api', f'repos/{repository}/{path}'], check=True, capture_output=True, text=True).stdout)
          run = api(f'actions/runs/{run_id}')
          expected = '.github/workflows/macos.yml' if platform == 'macos' else '.github/workflows/windows-release.yml'
          if run.get('path') != expected or run.get('head_branch') != 'master' or run.get('head_repository', {}).get('full_name') != repository:
              raise ValueError('Build source is not this project master workflow')
          jobs = api(f'actions/runs/{run_id}/jobs')['jobs']
          if platform == 'macos':
              builds = [job for job in jobs if job['name'].startswith('build (')]
              if len(builds) != 2 or any(job['conclusion'] != 'success' for job in builds):
                  raise ValueError('Both native Mac builds must pass')
          else:
              package = next(job for job in jobs if job['name'] == 'package')
              required = ('Freeze mover and package Windows application', 'Audit silent install, reinstall, self checks and safe uninstall')
              if any(not any(step['name'] == name and step['conclusion'] == 'success' for step in package['steps']) for name in required):
                  raise ValueError('Windows package and real installer checks must pass')
          source = run['head_sha']
          if not re.fullmatch(r'[0-9a-f]{40}', source):
              raise ValueError('Invalid source commit')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'source={source}\n')
      - uses: actions/download-artifact@v4
        if: inputs.platform == 'macos'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: macos-*
          path: artifacts/release-stage
      - uses: actions/download-artifact@v4
        if: inputs.platform == 'windows'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          name: windows-release
          path: artifacts
      - name: Stage tested assets without changing a public release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ steps.build.outputs.source }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          if [ "$PLATFORM" = macos ]; then
            python3 scripts/stage_macos_release.py --artifacts artifacts/release-stage --commit "$SOURCE"
          else
            python3 scripts/stage_windows_release.py --commit "$SOURCE"
          fi
      - name: Independently download and compare every staged Mac asset
        if: inputs.platform == 'macos'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ steps.build.outputs.source }}
        run: python3 scripts/verify_macos_release.py --artifacts artifacts/release-stage --commit "$SOURCE" --report artifacts/release-verification.json
      - uses: actions/upload-artifact@v4
        if: inputs.platform == 'macos'
        with:
          name: macos-release-verification
          path: artifacts/release-verification.json
      - name: Independently download and compare every staged Windows asset
        if: inputs.platform == 'windows'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ steps.build.outputs.source }}
        run: python3 scripts/verify_windows_release.py --artifacts artifacts --commit "$SOURCE" --report artifacts/windows-release-verification.json
      - uses: actions/upload-artifact@v4
        if: inputs.platform == 'windows'
        with:
          name: windows-release-verification
          path: artifacts/windows-release-verification.json
          if-no-files-found: error
