name: Isolated native refresh guard probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r macos/requirements.txt
      - run: python scripts/probe_refresh_guard.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-source-refresh-guard
          path: artifacts/source-refresh-guard.json
