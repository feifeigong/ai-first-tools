name: macOS preview
on:
  workflow_dispatch:
  push:
    paths:
      - 'macos/**'
      - 'workspace/Reset*.cs'
      - 'auto-resume/**'
      - 'dialog-mover/**'
      - 'txcript/**'
      - 'scripts/*macos*.py'
      - 'docs/MACOS.md'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'macos/**'
      - 'workspace/Reset*.cs'
      - 'auto-resume/**'
      - 'dialog-mover/**'
      - 'txcript/**'
      - 'scripts/*macos*.py'
      - '.github/workflows/macos.yml'
permissions:
  contents: read
concurrency:
  group: macos-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install native Python dependencies
        run: python -m pip install -r macos/requirements.txt
      - name: Build shared reset rules for isolated platform checks
        run: dotnet build macos/ResetBridge/ResetBridge.csproj -c Release
      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal && rustup default 1.96.0
      - uses: actions/cache/restore@v4
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            txcript/target
          key: macos-${{ matrix.architecture }}-rust196-${{ hashFiles('txcript/Cargo.lock') }}
      - name: Build the project's own migration engine
        run: |
          cargo build --release --locked --manifest-path txcript/Cargo.toml
          mkdir -p dialog-mover/bin
          cp txcript/target/release/txcript dialog-mover/bin/txcript
      - name: Shared safety, Mac paths and isolated native imports
        working-directory: dialog-mover
        run: |
          python -m unittest test_memory test_codex_sources test_codex_compressed test_chatgpt test_close_safety test_doubao test_copilot test_copilot_import test_copilot_refresh test_macos_copilot_refresh test_macos test_macos_updater test_macos_native test_codex_history test_macos_resume test_macos_reset test_macos_memory test_macos_parity_release test_macos_history -v
      - name: Prepare official Copilot test runtime with pinned integrity
        run: python scripts/prepare_copilot_audit.py
      - name: Native Copilot full history and strict resume without model requests
        working-directory: dialog-mover
        run: python -m unittest test_copilot_native -v
      - name: Auto-resume algorithm regression
        working-directory: auto-resume
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Prepare checksum-pinned native history reader for tests only
        run: python scripts/prepare_native_history_audit.py --architecture '${{ matrix.architecture }}'
      - name: Native pagination without model requests
        working-directory: dialog-mover
        run: python -m unittest test_codex_native -v
      - name: Package and test actual Cocoa app and DMG
        env:
          AI_FIRST_CI_UPDATE_TOKEN: ${{ github.token }}
        run: python scripts/package_macos.py --architecture '${{ matrix.architecture }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-${{ matrix.architecture }}
          if-no-files-found: warn
          path: |
            artifacts/macos/${{ matrix.architecture }}/*.dmg
            artifacts/macos/${{ matrix.architecture }}/SHA256SUMS-*.txt
            artifacts/macos/${{ matrix.architecture }}/*test.json
      - uses: actions/cache/save@v4
        if: always() && steps.cargo-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            txcript/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
  stage-release:
    needs: build
    if: github.repository == 'feifeigong/ai-first-tools' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: artifacts/release-stage
      - name: Stage only verified packages into the existing release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/stage_macos_release.py --artifacts artifacts/release-stage --commit "$GITHUB_SHA"
