name: Windows checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r dialog-mover/requirements-dev.txt
      - name: Prepare the verified migration engine for isolated exports
        shell: pwsh
        run: |
          if ((git rev-parse v0.3.6:txcript) -ne (git rev-parse HEAD:txcript)) { throw 'Engine source changed; do not reuse an old binary.' }
          New-Item -ItemType Directory -Force artifacts/build-tools,dialog-mover/bin | Out-Null
          Invoke-WebRequest 'https://github.com/feifeigong/ai-first-tools/releases/download/v0.3.6/AI-First-Tools-Portable-0.3.6-win-x64.zip' -OutFile artifacts/build-tools/verified-engine-source.zip
          if ((Get-FileHash artifacts/build-tools/verified-engine-source.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '5b8bbd50156e162d3961358f2daa49847f4224db0ce3257c16fcd93f4866aedd') { throw 'Verified source archive digest mismatch' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive=[IO.Compression.ZipFile]::OpenRead((Resolve-Path artifacts/build-tools/verified-engine-source.zip))
          try {
            $entry=$archive.GetEntry('AI-First-Tools/tools/dialog-mover-v0.3/_internal/bin/txcript.exe')
            if (!$entry) { throw 'The verified archive has no migration engine' }
            [IO.Compression.ZipFileExtensions]::ExtractToFile($entry,(Join-Path $PWD 'dialog-mover/bin/txcript.exe'))
          } finally { $archive.Dispose() }
          if ((Get-FileHash dialog-mover/bin/txcript.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne '799b80dff7ba44cb05f1a92ed5f64a4969ffefc5ad7b3566600ed88adaaaacd2') { throw 'Migration engine digest mismatch' }
      - name: Build and check shared Mac and Windows reset rules
        run: |
          dotnet build macos/ResetBridge/ResetBridge.csproj -c Release
          dotnet macos/ResetBridge/bin/Release/net8.0/AI.First.ResetBridge.dll --self-test --report artifacts/mac-reset-rules-test.json
      - name: Backend safety and sidebar checks
        working-directory: dialog-mover
        run: python -m unittest test_memory test_codex_sources test_codex_compressed test_chatgpt test_close_safety test_embedded_startup test_doubao test_copilot test_copilot_import test_copilot_refresh test_macos_copilot_refresh test_windows_release test_macos test_macos_updater test_codex_history test_macos_resume test_macos_reset test_macos_memory test_macos_parity_release test_macos_history test_release_highlights -v
      - name: Prepare official Copilot test runtime with pinned integrity
        run: python scripts/prepare_copilot_audit.py
      - name: Native Copilot full history and strict resume without model requests
        working-directory: dialog-mover
        run: python -m unittest test_copilot_native -v
      - name: Isolated auto-resume control checks
        shell: powershell
        run: |
          ./workspace/tests/AutoResumeControl.Tests.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./workspace/tests/AutoResumeBundled.Tests.ps1
      - name: Bundled auto-resume engine regression
        working-directory: auto-resume
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Independent Windows asset validation checks
        run: python -m unittest discover -s scripts -p test_verify_windows_release.py -v
      - name: UI checks with synthetic records
        working-directory: dialog-mover
        run: python -m unittest test_memory_ui test_codex_sources_ui test_agent_icons test_import_ui test_ui_polish test_macos_ui test_macos_resume_ui test_macos_reset_ui test_release_highlights_ui -v
      - run: dotnet build workspace/AIFirst.Workspace.csproj -c Release
      - name: Workspace self checks
        shell: pwsh
        run: |
          $app = Resolve-Path 'workspace/bin/Release/net8.0-windows/win-x64/AI一手工具工作台.exe'
          $report = Join-Path $env:RUNNER_TEMP 'workspace-checks.json'
          $process = Start-Process -FilePath $app -ArgumentList @('--self-test', '--report', $report) -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Workspace self checks failed' }
