<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>对话搬家</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <img src="assets/dialog-mover.png" width="38" height="38" alt="" />
        </div>
        <div>
          <div class="brand-name">对话搬家</div>
          <div class="brand-sub">把记录复制到另一个软件</div>
        </div>
      </div>
      <div class="rail-label">已安装的软件</div>
      <nav id="agents" class="agents" aria-label="已安装的软件"></nav>
      <div class="rail-foot">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>
        <span>只复制，不会删除或改动原来的记录</span>
      </div>
    </aside>

    <main class="stage">
      <header class="stage-head">
        <div class="titles">
          <h1 id="title">选择一个软件</h1>
          <p id="subtitle">从左边点一个软件，就能看到里面的对话。</p>
        </div>
        <div class="tools">
          <button id="fold-all" class="fold-all" hidden></button>
          <label class="search">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
            <input id="search" type="search" placeholder="搜索标题或文件夹" aria-label="搜索标题或文件夹" autocomplete="off" />
          </label>
          <button id="reload" class="icon-btn" title="重新读取" aria-label="重新读取">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
          </button>
        </div>
      </header>
      <div id="chips" class="chips" hidden></div>
      <section id="list" class="list" aria-live="polite">
        <div class="startup-placeholder" role="status"><div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div><div class="skeleton" aria-hidden="true"></div><p>正在读取本机记录…</p></div>
      </section>
    </main>
  </div>

  <div id="bar" class="bar" hidden>
    <div class="bar-info"><b id="bar-count">0</b><span id="bar-text">条已选</span></div>
    <div class="bar-actions">
      <button id="bar-clear" class="btn ghost">取消选择</button>
      <button id="bar-go" class="btn primary">
        搬到…
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <div class="sheet-top">
        <button id="sheet-back" class="back" aria-label="返回">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
          <span id="sheet-back-text">返回</span>
        </button>
        <ol id="steps" class="steps"></ol>
        <button class="close" data-close aria-label="关闭">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12"/><path d="M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="sheet-body" class="sheet-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
